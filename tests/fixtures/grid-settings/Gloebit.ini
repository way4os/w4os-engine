;; Included by the OpenSim.ini of the old grid: its money module, which replaces the economy said before it
[Gloebit]
    Enabled = true
    GLBEnvironment = production
    GLBKey = made-up-key-of-the-old-grid
    GLBSecret = made-up-secret-of-the-old-grid
    GLBOwnerName = "Money Owner"
    GLBOwnerEmail = "money@example.org"
    GLBSpecificStorageProvider = "OpenSim.Data.MySQL.dll"n
    GLBSpecificConnectionString = "Data Source=db.example.org;Database=gloebit;User ID=gloebit;Password=made-up-password;Old Guids=true;"

[Economy]
    economymodule = Gloebit
    economy = ${Const|WebURL}/gloebit
    SellEnabled = true
    PriceUpload = 0
    PriceGroupCreate = 0
