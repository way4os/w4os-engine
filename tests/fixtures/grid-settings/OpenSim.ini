;; The OpenSim.ini of an old grid (2.x), its values made up: what an import of its settings brings to a grid of this machine
[Const]
    BaseURL = "http://grid.example.org"
    PublicPort = "8002"
    PrivURL = "http://grid.example.org"
    PrivatePort = "8003"
    WebURL = "https://web.example.org"

[Startup]
    ConsolePrompt = "Old (\R) "

[Search]
    Module = "OpenSimSearch"; //This line is optional and shows the default.
    SearchURL = "${Const|WebURL}/helpers/query.php?gk=${Const|BaseURL}:${Const|PublicPort}"

[DataSnapshot]
    index_sims = true
    gridname = "Example"
    default_snapshot_period = 3600
    snapshot_cache_directory = "${Const|DataDirectory}/${Launch|simslug}/DataSnapshot"
    DATA_SRV_MISearch = "${Const|WebURL}/helpers/register.php"
    DATA_SRV_2do = "https://2do.directory/helpers/register.php"

[Economy]
    EconomyModule = DTLNSLMoneyModule
    CurrencyServer = "https://grid.example.org:8008/"
    UserServer = "${Const|BaseURL}:${Const|PublicPort}"
    economy = https://web.example.org/helpers/
    SellEnabled = true
    PriceUpload = 0
    PriceGroupCreate = 0

[Gloebit]
    Include-Gloebit = "Gloebit.ini"

[Messaging]
    OfflineMessageModule = OfflineMessageModule
    OfflineMessageURL = ${Const|WebURL}/helpers/offline.php
    StorageProvider = OpenSim.Data.MySQL.dll
    MuteListModule = MuteListModule
    ForwardOfflineGroupMessages = true
    MessageTransferModule = HGMessageTransferModule
    LureModule = HGLureModule
    Gatekeeper = "${Const|BaseURL}:${Const|PublicPort}"

[UserProfiles]
    ProfileServiceURL = "${Const|BaseURL}:${Const|PublicPort}"
    AllowUserProfileWebURLs = true

[Groups]
    Enabled = true
    Module = "Groups Module V2"
    ServicesConnectorModule = "Groups HG Service Connector"
    LocalService = remote
    GroupsServerURI = "${Const|PrivURL}:${Const|PrivatePort}"
    MessagingModule = "Groups Messaging Module V2"
    MessageOnlineUsersOnly = true
    NoticesEnabled = true
