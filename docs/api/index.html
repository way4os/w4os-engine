        "description": "The grids, the simulators and the services of an install, and what is in the databases of a grid, as JSON:API resources; the errors are problem details (RFC 9457).\n\nA list takes `search`, `sort` (`-` before a column for the descending order), `filter[<name>]`, `page[number]` and `page[size]`. The list operation of a model that describes its list says what a site shows of it in `x-list`: `columns` in their order (`name` the attribute, `label` a key of the catalog of texts, `type` how it shows: text, email, number, date, datetime (with its time: when it was created, last seen), boolean, picture, map, link, hop, size, status, role, list, indicators, area (square meters, shown in the unit that suits it: m² under a hectare, hectares under a km², km² above, two decimals but for m² and above 100 km²: `unit_m2`, `unit_ha`, `unit_km2` of the catalog, `OpenSim\\Text\\Units::area()`), usage (a percentage shown as a bar of 100, its `usage` the thresholds `warning` and `critical` from which it is orange or red, and for a usage of a total, the attributes of what it takes and of the total (`used`, `total`) and the key of their unit (`unit`): `usage_of`, 400 MB of 16,384 MB; the cpu is the share of all the CPUs of the machine since its process started, the memory the share of the memory of the machine); `sort` the sort it takes; `bare` whether its value reads without its label (an email, a role, a status, a picture: the label of the others comes before their value where a list folds them under the name, `label_value`); `mirrors` the filter whose value it repeats (the region of the parcels of a region): a site leaves it out when that filter is fixed to one value; `priority` `primary` for a column shown at every width (the first one, the status), `secondary` for one folded under the name on a narrow screen; `indicators` for an `indicators` column, its icons in their order, each `name` the attribute it shows (`connections.console`: a value of an object), `icon` what it means (power, run, play, pause, online and offline: a globe with a check and a crossed one, console, screen, file, files, database, server, account, account-online, account-banned, ban: a site gives each the icon of its own library), `label` the key of its title, `states` (`value`, `label`: the key of a text that says it all on its own, shown alone, `tone`: ok green when all is well, off grey when it is off as it normally is, warning orange for a partial or degraded state (a ban of some estates), failed red for an error; a difference between states that matters always changes the icon or the text too, never the color alone; `icon` its own icon, when it is not the one of the indicator) and `actions`, the names of the actions of the list that change it: the one whose `when` the row meets is the button of its icon, not a button of the row; a value no state has shows no icon; `subtitle` the attributes shown under it, the first that has a value (its address, else its slug: a list shows them there, never in a column of their own), `subtitleLink` the attribute that gives the address it links to; `picture`, `tag` and `tagLabel`, `link` the attributes shown with it (`picture` an asset UUID, shown as a thumbnail beside the value from the open `GET /grids/{grid}/assets/{id}.{format}`, at an address the browsers reach: the locked bridge of the site, never the address of the API on the machine; the map tile of a region is its `mapImage`); `default` what a missing picture stands for, `person` or `place`, as `default` of the pictures of the assets; `values` the words of a `list` with their `label` and `description`, as the values of a filter), `sort` (`default`, `values`, `descending`), `search` (the attributes it looks in), `filters` (`name`, `label`, `values` with their `label`, or `format` for one that takes any value; `multiple` for one that takes several values separated by commas, keeping what has any of them; `dynamic` for one whose values that give something are in `meta.available.<name>` of the list: the values, or `value` and `label` (a text, not a key) for one without `values`, such as the simulators; the number of rows each value of a filter gives is in `meta.counts.<name>.<value>`, counted with the search and the other filters asked, not its own) `views` (the filters a site shows as the row of links above the list, as w4os-wp does: All (n) | Default Model (n) | ...; their names in their order, the first link the whole list, `all` its label, `meta.total` without a filter; each value of a view with the label of its filter and its count, `meta.counts.<filter>.<value>`, the values of `size` the ones the list has, `meta.available.size`; the avatars: `type`, `active`, `online`, whose counts are the user avatars' only, as w4os-wp counts them; the regions: `status`, `size`), its texts, keys of the catalog: `title`, `menu` (its label in a menu), `placeholder` (of its search), `empty` (what it says without a row), `count` (a text that changes with the number of its rows, `%d`); `create` the button above the list that makes an item, not an action of a row (`label`, `method`, `path`, `operation` the operation whose `x-form` is its form: New Avatar) and `actions` (`name`, `label`, the operation as `method` and `path`, `{id}` the row, its `body` with `{attribute}` of the row, `when` the values of attributes a row must have, `requires` the attributes it must have, `notSelf` never on the avatar of whoever acts, `ask` the key of a question the site asks before (an action that sends avatars away), a string, `link` the page of the site its mail links to, `reset` or `confirm`: the site adds `link` to the body, the address of that page with `{token}` in it, and may add `send` false to get the token instead of a mail). The operation that reads an item of such a model says what its page shows and changes in `x-form`: `groups` (`name`, `label`) in their order, `header` what the head of the page shows, as the row of the list does (`title` the attribute of its name, `picture`, `default`, `subtitle`, `subtitleLink` as on the name of the list, `indicators` the ones of its status), `fields` in the standard field format of the engine (`name`, `label`, `type`: a type of column or `string`, `text`, `integer`, `number`, `boolean`, `select`, `checkboxes`, `secret` (given back as `********` when it is set, which sent back keeps it), `url`, `email`, `avatar`, `connection-string` (a database as an object of its parts, its `fields`: host, port, database, user, password, the password masked as a secret; `fallback` the key of the label of its Use default, when the grid has a database it uses without it: the value is then null, and `useDefault` true sent removes it), `path` (a path under a fixed address, `base` which: `site`, the web site of the grid, `meta.service.base`, shown before it, read-only), `note` (a text the page shows, its `description`, no value); `group`; `options` value => label for a select; `multiple` for one that takes several values, a list (the avatars of a list); `widget` how a site shows it when it is not the usual way of its type (`radio`: the choices of a select side by side, for a short list that stays short; a field without it shows as its type says); `placeholder` the key of the text shown in it while it is empty; `readOnly` for one that is only shown, the others being what the PATCH of the item takes; `writeOnly` for one the item does not give back; `condition` the values of other fields it is shown for; `access` `view` and `edit`, the roles `manager`, `self`, `owner` of whoever a site shows it to, the managers by default, and `level`, the lowest user level of a manager who changes it; `description`; `setting` the setting of the grid it needs true (`meta.settings` of the item, an attribute of the grid): when it is false, a site does not show the field and the PATCH ignores it (`profileUrl`, the web address of a profile, as the viewers do with AllowUserProfileWebURLs); `banner` for one the banner of a profile shows over all its tabs: its picture, its name, its birth, its role; `bare` for one whose value reads without its label, as in a list: its role) `actions` as in `x-list`, and `sections` what the page shows in its order, as tabs or one after the other as a site chooses (`name`, `label`, and `group` the fields of a group, or `items` a list of its own under the item: `posts`, `picks`, `classifieds`: the sections of a profile). The item itself gives in `meta.form` its `x-form` as its grid has it, without the fields its grid does not allow (`setting` false in `meta.settings`), nor the groups and sections left without them: the web address of a profile and its section when AllowUserProfileWebURLs is false; a site shows that one; a form that is not an item (the settings of a grid, `/grids/{grid}/settings/{group}`: read with GET, changed with PATCH) has its `title`, its `menu` (its short label in a menu, w4os-wp's), its `submit`, the label of its button, its `saved` (the message once it is saved); a page of a service of the helpers (economy, search, guide, offline, assets) starts with `provide`, Provide as w4os-wp has it (true when the grid sets no address of it, or one on its site): true, the site handles the service at `path` under its web site, false, another server at the whole address (its field after them); the other fields of the page are shown when `provide` is true only (false: the whole address alone); the page is w4os-wp's (its fields in its order, its words, its conditions), its `description` the points of its sidebar, the `description` of a field the points of its help; `meta.fixed` the fields of any page this server cannot change for the grid (it cannot write the file the grid reads it in, or the grid has no files here; what only the helpers and the site read goes then to the settings the application keeps): by field, its `reason` (a notice: `code`, `params`, the English `detail`; its text `notice_<code>` of the catalog), the `file` and the `text` to write there by hand, never a secret; a site shows such a field read-only with them; `meta.snippets` the lines of the files of the grid a field shows, by field, each `file` (null for a sample) and `text`, made for the grid, never with a secret; its `meta.service` says who handles the requests, for a site to route them: `key` the service, `base` the web site, `helpers` the base of the helpers, `handledBy` `helpers` (the address under their base), `site` (elsewhere on the site: a page of the site that shows the block `block` of the helpers, else the operation of the engine `endpoint`), `elsewhere` (Provide off), null without an address; the health then asks that page and wants its block (`data-helpers-block`), its help (`description`: the keys of its points, in their order) and the list of what its settings pick (`preview`: `label` its title, `empty` what it says when there is none, `path` the list, `filters` the fields given as its filters as they are changed, so that it is seen before it is saved: the avatar models a rule picks). The operation that makes an item says in `x-form` what a site shows to make one (an avatar: the fields of the creation of w4os-wp): its `title`, its help (`description`, the keys of its points), `fields` as above (`required`; `pattern` the regular expression the whole value matches; `maxLength`; `source` for a select whose choices are a list of the API: `path` the list, `value` and `label` the attributes of an item that give the value and its text, `picture` the one of its picture (an asset), `empty` the key of what it says when the list has none; a select that is not `required` may be left without a choice: the avatar models, the default outfit) and `submit`, the key of its button. The operation that adds a post to the stream of an avatar says in `x-form` what a site shows to write one: `fields` as above (`maxLength` the longest text, `required`), `submit` the key of its button and `actions` what its own posts take (`{id}` the avatar, `{post}` the post). The labels are keys of the catalog (`share/languages`), so the document is the same in every language.\n\nThe URI of a region is `host:port/Region Name` (the name as it is, its spaces too), the one of a parcel `host:port/Region Name/x/y/z` (the point it is entered at); a hop:// link (`teleport`) has its spaces as %20 (`hop://host:port/Region%20Name/x/y/z`), the form the viewer writes itself; in a viewer, a site links every destination, of the grid or of another one, as `secondlife://host:port/secondlife/Region%20Name/x/y/z` (`Destination::AUTO`, `Grid::link()`: the engine tells a viewer by the user agent); a hop:// link never has a colon before the region. The links HG (`secondlife://host:port:Region`) and V3HG are deprecated: they failed in every viewer tried. Both `host:port/Region` and `host:port:Region` are read. This is an important change in the canonical form 3.0 gives: not tested against 2.x, but in theory compatible, since 2.x already accepted both forms.\n\n## Who may do what through a site\n\nEvery operation says it in `x-access`, by the user levels of OpenSimulator (0 GOD_NOT, 1 GOD_LIKE, 100 GOD_CUSTOMER_SERVICE, 150 GOD_LIAISON, 200 GOD_FULL, 250 GOD_MAINTENANCE; a level has every right of the ones below it): `level`, the lowest level of a person who does it on what is not their own (none: anybody may), and `self`, whether a visitor may do it for their own account. `needs`, what of a grid it needs the engine to reach, among the `access` of the grid: `files` (its config on this machine: the repair of its options), `settings` (the change of its settings: in its files, or in the settings the application keeps, `Environment::system(settings:)`), `databases` (what they hold); a site hides or disables an operation whose needs the grid has not, as the engine answers it unavailable (503, its `reason`: a notice, `code`, `params`, the English `detail`). The engine does its best with what it has: what its databases and its answers over HTTP give is given. Reading and the care of the accounts are for the customer service and above (100); what changes the grid itself (its instances, its regions, its setups, its backups and restores, the role of an avatar) for a god (200), as only GOD_FULL has rights of its own in OpenSimulator; 250 is never needed. What belongs to a site and not to the engine (its own settings, such as its theme) is changed by whom `x-site` says at the root of this document (`settings`: a god, as any change). A site asks `OpenSim\\Api\\Access` (or reads `x-access` and `x-site`), it never writes a level. The key of the site is what opens the API: the level is the one of the person the site acts for.\n\n## Authentication\n\nThe API is closed: what manages the machine and the grids (the resources, the tasks, the health) needs an API key, sent as `Authorization: Bearer <key>`. A key is made on the machine and shown once: `opensim api-key create <label>`; `opensim api-key list` lists them without what opens them, `opensim api-key revoke <label>` (or its id) closes one. A key opens everything for now. To try the API from this documentation, open the [test page](try.html), enter the address of the API and click Authorize.\n\nWhat the viewers, the simulators and the visitors of a site call needs none (the message of the day, the guide, the pictures, the status of the grid, the pages): the operations marked as open. The calls in a format of OpenSimulator and the viewers (search, registration, offline messages, currency, land tools) are protected by what the protocol has: the secure session of an avatar, the secret of a region, the key of the money server."
    },

            "url": "/",

    "tags": [
        {
            "name": "Grids",
            "description": "A grid run from this machine, only described here (a grid joined on another machine), or a standalone (one simulator that serves it all)."
        },
        {
            "name": "Simulators",
            "description": "A simulator is identified by its address (host:port); its slug has its grid (`vonda.welcome`). A simulator of another machine that runs regions of a grid of this one (registered with its Robust) is listed too, `local` false: known by its address only, running while one of its regions is online, every way to it `none`. `connections` says how the engine reaches a simulator (`console`, `screen`, `config`, `regions`, `mysql` or `sqlite`; the config of the Robust belongs to the grid), each `none`, `configured` (in a list: named in its config, not tried), `ok` or `failed` (alone: tried)."
        },
        {
            "name": "Services",
            "description": "What the simulators and the users of a grid ask for: the assets, the profiles, the login, the search. A service is served by a Robust of the grid, by the simulator of a standalone, or by a web site (the helpers) at an address the config of the grid gives.\n\n`get-grid-info` is the /get_grid_info that Robust answers: the engine reads it, it does not provide one.\n\n`kind` says who fixes the format of a web service: `fixed` (OpenSimulator or the viewers: only the address is the grid's to choose, and the format is described in this contract as an endpoint of its own) or `standard` (the engine's own; `standard` is its address, `legacy` the script that answered it before). `endpoint` is where the engine serves it."
        },
        {
            "name": "Archives",
            "description": "The inventories (`iar`) and the regions (`oar`) the consoles of the simulators saved, in the data folder of their grid, and the backups of the setup (`backup`: the configuration, the data and the databases of a grid or of a simulator, `.tar.gz`). A file says what is in it by its name; they are read here, made by `opensim save iar|oar` and `opensim backup`."
        },
        {
            "name": "Avatars",
            "description": "Read from the databases of the grid, each in the one of its service. An avatar is made with its account, its password, its inventory and its default outfit, or the outfit of an avatar model. Its name does not change."
        },
        {
            "name": "Avatar models",
            "description": "The avatars a new avatar can look like: it wears a copy of the outfit and the appearance of the model it is made from (`model` of a new avatar). The models are the active avatars the rule of `[Models]` picks: `Match` is `first` (the first name is `MatchPattern`), `last` (the last name is), `any` (either, the default) or `uuid` (the avatars of `List`); `MatchPattern` is `Default` by default. A model is made in the console of Robust, dressed in a viewer and given a profile picture; it is never the avatar of a person.\n\n`picture` is the asset to show (`/grids/{grid}/assets/{picture}.jpg`): its profile picture, else a placeholder.\n\nThe filters `match`, `pattern` and `list` (UUIDs separated by commas) ask the models of another rule than the grid's, what is not asked being the grid's: the preview of the settings `models` as they are changed, before they are saved."

            "name": "Regions",

        },
        {
            "name": "Parcels",
            "description": "The land of every simulator of the grid, read in the database of each."
        },
        {
            "name": "Posts",
            "description": "What every avatar posted on its profile (Flux), for the admin list of the posts of w4os-wp's Flux: the post, its Author, its date, the newest first. An avatar writes and deletes its own under its profile (`/grids/{grid}/avatars/{id}/posts`); the customer service and above delete any here."
        },
        {
            "name": "Estates",
            "description": "The estates of the grid when its Robust serves them, else the ones of each simulator. A new estate is made by the console of its simulator when it runs (`estate create`), else in its database with the settings OpenSimulator gives a new one; a region goes to another estate by its `estate` (PATCH of the region)."
        },
        {
            "name": "Assets",
            "description": "What the grid keeps in its asset service: textures, sounds, notecards, scripts, objects... A record never carries its data: an image of any type (texture, TGA, JPEG) is asked as a picture (`/grids/{grid}/assets/{id}.{format}`, the grid keeps textures as JPEG 2000 and the engine converts them and keeps the result for a day), the other types as they are."
        },
        {

        {
            "name": "Search",
            "description": "The search of the grid, made by the helpers: the simulators register to it and tell it their regions (a snapshot the helpers read), the viewers ask it for places, popular places, land for sale, events and classifieds. The format is the one of the module OpenSimSearch of the simulators; the address is the grid's to choose (`SearchURL` of `[Search]` and `DATA_SRV_*` of `[DataSnapshot]` in OpenSim.ini). A search can be shared by several grids: `gk`, the gatekeeper of the grid that asks, tells for which the search is made (the viewers do not send it). These calls need no API key: the viewers and the simulators do not send one."
        },
        {
            "name": "Economy",
            "description": "The currency and the land tools of the grid, as the viewers and the money modules call them: XML-RPC at `currency.php` and `landtool.php` under the economy address the grid gives its viewers (`economy` of `[GridInfoService]`). Nothing is served without the key of the grid (`MoneyScriptAccessKey` of `[MoneyServer]`): a quote is tied to its purchase with it and to the address of who asked. An avatar proves who they are with their secure session, a region with its secret: no API key is needed, the viewers do not send one."
        },
        {
            "name": "Offline messages",
            "description": "The messages for the avatars who are not there, with the module V1 of the simulators (`OfflineMessageModule = OfflineMessageModule`, `OfflineMessageURL` of `[Messaging]`), which posts them here in XML. The messages are kept in the table of the offline messages of Robust, the one its module V2 uses; an avatar who asked for it in their viewer also gets them by email. The other choice is the module V2 and the service of Robust, which needs none of this: with the helpers, the messages are mailed on request and none is lost; with Robust, nothing more is run, no mail is sent and 25 messages are kept per avatar."
        },
        {
            "name": "Avatar access",
            "description": "What a site or the command line needs to let the people of the grid in, without holding any logic: sign an avatar in with its name (or its email) and its password, checked in the databases of the grid as Robust keeps them; a forgotten password; the confirmation of the email of a new avatar (`confirmEmail` of a new avatar: it is only a registration, nothing is written in the grid until its email is confirmed), or of a new email (`confirmEmail` of a change of an avatar: the email changes once it is confirmed).\n\nEvery problem has a `code` that says what went wrong, for a site to tell it in its own language: `sign-in-refused`, `account-disabled` (a manager disabled it), `email-unconfirmed` (it waits for the confirmation of its email), `name-reserved`, `name-taken`, `token-refused`... (see the Problem schema). The `detail` is the English one.\n\nA forgotten password and a confirmation are a one-time token, kept hashed in the database of the passwords (`avatar_tokens`, and `avatar_registrations` for a new avatar, with its password hashed as Robust keeps it; an expired registration is forgotten whenever another one comes or a token is checked), mailed to the avatar with a link to the page that takes it: the `link` the caller gives (`{token}` in it is replaced by the token, else `token=` is added), else the page of the grid (`password` of `[GridInfoService]` for a password, `register` for a confirmation). The mail gives the token as a code too. Whoever cannot mail it (no mail system, an administrator, an agent that delivers it otherwise) sends `send: false` and gets the token instead. The mails come from `MailSender` of `[Helpers]`, else no-reply@ the host of the grid.\n\nA token is valid once: a day for a password, two days for a confirmation (the avatar may ask for another one). An avatar has one token at a time for each."

                "tags": [
                    "Avatars"
                ],
                "summary": "Make avatar",
                "parameters": [
                    {
                        "name": "grid",
                        "in": "path",
                        "required": true,
                        "description": "The nick of the grid",
                        "schema": {
                            "type": "string"
                        }
                    }
                ],
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/vnd.api+json": {
                            "schema": {
                                "type": "object",
                                "properties": {
                                    "data": {
                                        "type": "object",
                                        "properties": {
                                            "attributes": {
                                                "type": "object",
                                                "properties": {
                                                    "name": {
                                                        "type": "string",
                                                        "description": "First Last (or firstName and lastName). All in small letters or all in capitals, each part gets a capital and the rest small letters (bart simpson and BART SIMPSON are Bart Simpson); capitals and small letters mixed are kept as typed (McFly, JeanPaul deLuxe), and so is a reservedName"
                                                    },
                                                    "firstName": {
                                                        "type": "string",
                                                        "description": "Its first name, with lastName, in place of name"
                                                    },
                                                    "lastName": {
                                                        "type": "string",
                                                        "description": "Its last name, with firstName"
                                                    },
                                                    "email": {
                                                        "type": "string"
                                                    },
                                                    "password": {
                                                        "type": "string",
                                                        "description": "The password (or passwordHash)"
                                                    },
                                                    "passwordHash": {
                                                        "type": "object",
                                                        "description": "hash and salt of a password that is moved"
                                                    },
                                                    "uuid": {
                                                        "type": "string",
                                                        "description": "The UUID of an account that is moved"
                                                    },
                                                    "home": {
                                                        "type": "string",
                                                        "description": "The UUID of the home region"
                                                    },
                                                    "model": {
                                                        "type": "string",
                                                        "description": "The UUID or the name of an avatar model (`/grids/{grid}/avatar-models`): the avatar wears a copy of its outfit instead of the default one"
                                                    },
                                                    "active": {
                                                        "type": "boolean",
                                                        "description": "The account can log in (the default); false: disabled"
                                                    },
                                                    "confirmEmail": {
                                                        "type": "boolean",
                                                        "description": "Nothing is made yet: everything is checked, the registration is kept (name, email, model, the password hashed) and mailed a token to confirm its email, which makes the avatar, active (see Avatar access). The answer is 202, a `registrations` resource; `meta.emailConfirmation` says `sent`, `not sent` (the mail failed) or `given`. Only name, email, password, model and reservedName are taken"
                                                    },
                                                    "link": {
                                                        "type": "string",
                                                        "description": "With confirmEmail: the page that takes the token, `{token}` in it"
                                                    },
                                                    "send": {
                                                        "type": "boolean",
                                                        "description": "With confirmEmail, false: the token is not mailed but given in `meta.confirmation` (`token`, `expires`, `link`, `email`), for whoever delivers it"
                                                    },
                                                    "published": {
                                                        "type": "boolean",
                                                        "description": "Its profile is public (\"show in search\" in the viewer): true by default for a new avatar, false for a reservedName unless it is said"
                                                    },
                                                    "reservedName": {
                                                        "type": "boolean",
                                                        "description": "The name may have a part w4os keeps (Default, Test, Admin, the name of the grid): an avatar model, made on purpose. Without it such a name is refused (`name-reserved`)"
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                },
                "responses": {
                    "201": {
                        "description": "Made; its address is in the Location header",
                        "content": {
                            "application/vnd.api+json": {
                                "schema": {
                                    "type": "object",
                                    "properties": {
                                        "data": {
                                            "$ref": "#/components/schemas/Avatars"
                                        }
                                    }
                                }
                            }
                        }
                    },
                    "202": {
                        "description": "With confirmEmail: the registration is kept, the avatar is made once its email is confirmed (see Avatar access). `meta.emailConfirmation` says `sent`, `not sent` (the mail failed) or `given` (with `meta.confirmation`)",
                        "content": {
                            "application/vnd.api+json": {
                                "schema": {
                                    "type": "object",
                                    "properties": {
                                        "data": {
                                            "type": "object",
                                            "properties": {
                                                "type": {
                                                    "type": "string",
                                                    "enum": [
                                                        "registrations"
                                                    ]
                                                },
                                                "id": {
                                                    "type": "string",
                                                    "description": "The UUID the avatar will have"
                                                },
                                                "attributes": {
                                                    "type": "object",
                                                    "properties": {
                                                        "avatar": {
                                                            "type": "string"
                                                        },
                                                        "name": {
                                                            "type": "string"
                                                        },
                                                        "firstName": {
                                                            "type": "string"
                                                        },
                                                        "lastName": {
                                                            "type": "string"
                                                        },
                                                        "email": {
                                                            "type": "string"
                                                        },
                                                        "model": {
                                                            "type": [
                                                                "string",
                                                                "null"
                                                            ],
                                                            "description": "The name of the model"
                                                        },
                                                        "expires": {
                                                            "type": "integer",
                                                            "description": "When it is forgotten unless its email is confirmed (Unix time)"
                                                        }
                                                    }
                                                }
                                            }
                                        },
                                        "meta": {
                                            "type": "object"
                                        }
                                    }
                                }
                            }
                        }
                    },

                        "description": "A value is wrong, `code` says which: a name that is not one, reserved or taken, no password or a wrong one, a wrong email, an unknown model",

                                                    "status": {
                                                        "type": "string",

                                                        "type": "boolean",

                                                        "type": "array",
                                                        "description": "The check boxes of what it wants: their names (build, explore, meet, group, buy, sell, be-hired, hire), or their number as the viewer keeps it"
                                                    },
                                                    "skillsList": {
                                                        "type": "array",
                                                        "description": "The check boxes of what it is good at: their names (textures, architecture, event-planning, modeling, scripting, custom-characters), or their number"

                                                        "type": "string",
                                                        "description": "The UUID of the home region"

                                                        "type": "string",
                                                        "description": "Of its profile, made when the avatar has none yet"

                                                    "profileUrl": {
                                                        "type": "string"
                                                    },
                                                    "wants": {
                                                        "type": "string"
                                                    },
                                                    "skills": {
                                                        "type": "string"
                                                    },
                                                    "languages": {
                                                        "type": "string"
                                                    },
                                                    "firstLife": {
                                                        "type": "string"
                                                    },
                                                    "confirmEmail": {
                                                        "type": "boolean",
                                                        "description": "The new email is not changed but mailed a token to confirm it (see Avatar access), which changes it; the avatar stays as active as it is. `meta.emailConfirmation` says `sent`, `not sent` or `given`"

                                }
                            }

        "/grids/{grid}/search/query": {
            "post": {
                "operationId": "searchQuery",
                "tags": [
                    "Search"
                ],
                "summary": "Search questions",
                "description": "The questions of the viewers and of the simulators to the search. XML-RPC, as the module OpenSimSearch speaks it: the body is a method call with one struct, the answer a struct with `success`, `errorMessage` and the rows in `data` (nothing in `data` when there is no result or it failed). The grid has the status of a failure only when the request is not understood or the search is not there.\n\n### `dir_places_query`\n\nThe places (parcels shown in search) whose name or description has the words.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `text` | string | The words, separated by spaces |\n| `flags` | integer | The rating the viewer wants: bits 24 (PG), 25 (Mature), 26 (Adult); bit 10 asks the order by traffic |\n| `category` | integer | The category of the places, 0 for any |\n| `query_start` | integer | The row to start from, 101 are given at most |\n\n**Answer** (each row of `data`)\n\n| Field | Type | |\n| --- | --- | --- |\n| `parcel_id` | string | The identifier the viewer shows the place by |\n| `name` | string | The name of the parcel |\n| `for_sale` | string | Always False: the land for sale is another question |\n| `auction` | string | Always False |\n| `dwell` | number | Its traffic |\n| `regionname` | string | The region it is in; the other columns of the parcel and of its region come with it |\n\n### `dir_popular_query`\n\nThe popular places, by traffic.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `text` | string | Words of the name, empty for all |\n| `flags` | integer | Bit 12 asks the places that have a picture; bits 24 to 26 the rating |\n| `query_start` | integer | The row to start from, 100 are given at most |\n| `include_hypergrid` | string | `false` keeps the places of the other grids out |\n| `include_landsales` | string | `true` adds the land for sale |\n| `gatekeeper_url` | string | The grid the search is made for, when the address does not say it (`gk`) |\n\n**Answer** (each row of `data`)\n\n| Field | Type | |\n| --- | --- | --- |\n| `parcel_id` | string | The identifier of the place |\n| `name` | string | The name |\n| `dwell` | number | Its traffic |\n| `gatekeeperURL` | string | The grid it belongs to |\n| `regionname` | string | The region it is in |\n| `regionUUID` | string | The UUID of the region |\n| `landingpoint` | string | Where an avatar lands |\n| `imageUUID` | string | Its picture |\n\n### `dir_land_query`\n\nThe land for sale.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `flags` | integer | Bits 24 to 26 the rating; 20 asks a price limit, 21 an area limit; the order is bit 15 (ascending), 16 (price), 18 (area), 19 (name), by price per meter by default |\n| `type` | integer | The kind of land: 4294967295 for any, bits 3 and 4 for the mainland or an estate, auctions are not listed |\n| `price` | integer | The highest price, when flags asks it |\n| `area` | integer | The smallest area, when flags asks it |\n| `query_start` | integer | The row to start from, 101 are given at most |\n\n**Answer** (each row of `data`)\n\n| Field | Type | |\n| --- | --- | --- |\n| `parcel_id` | string | The identifier of the parcel |\n| `name` | string | Its name |\n| `auction` | string | Always false |\n| `for_sale` | string | Always true |\n| `sale_price` | integer | Its price |\n| `landing_point` | string | Where an avatar lands |\n| `region_UUID` | string | The region it is in |\n| `area` | integer | Its area in square meters |\n\n### `dir_events_query`\n\nThe events of a day, or the ones to come.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `text` | string | `day\\|category\\|words`: the day is a number of days from today, or `u` for the events to come and in progress; the category 0 for any |\n| `flags` | integer | Bits 24 to 26: the rating |\n| `query_start` | integer | The row to start from, 101 are given at most |\n\n**Answer** (each row of `data`)\n\n| Field | Type | |\n| --- | --- | --- |\n| `owner_id` | string | Who organizes it |\n| `name` | string | Its title |\n| `event_id` | integer | Its identifier |\n| `date` | string | When it starts, in Pacific time (`m/d h:i A`), as the viewers show it |\n| `unix_time` | integer | When it starts, Unix time |\n| `event_flags` | integer | The rating: 0 PG, 1 Mature, 2 Adult |\n| `landing_point` | string | Where it is on the map of the world (`x,y,z`) |\n\n### `dir_classified_query`\n\nThe classifieds of the profiles, by price of the listing.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `text` | string | Words of the name or of the description |\n| `flags` | integer | Bits 2 (PG), 3 (Mature), 6 (Adult) |\n| `category` | integer | The category, 0 for any |\n| `query_start` | integer | The row to start from, 101 are given at most |\n\n**Answer** (each row of `data`)\n\n| Field | Type | |\n| --- | --- | --- |\n| `classifiedid` | string | The UUID of the classified |\n| `name` | string | Its title |\n| `classifiedflags` | integer | Its flags |\n| `creation_date` | integer | Unix time |\n| `expiration_date` | integer | Unix time |\n| `priceforlisting` | integer | What the listing costs |\n\n### `event_info_query`\n\nOne event, with all it says.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `eventID` | integer | The identifier of the event |\n\n**Answer** (each row of `data`)\n\n| Field | Type | |\n| --- | --- | --- |\n| `event_id` | integer | Its identifier |\n| `creator` | string | Who made it |\n| `name` | string | Its title |\n| `category` | string | Its category by name (Discussion, Sports, Live Music, Commercial, Nightlife/Entertainment, Games/Contests, Pageants, Education, Arts and Culture, Charity/Support Groups, Miscellaneous) |\n| `description` | string | What it is |\n| `date` | string | When it starts, server time |\n| `dateUTC` | integer | When it starts, Unix time |\n| `duration` | integer | Minutes |\n| `covercharge` | integer | Whether there is a cover charge |\n| `coveramount` | integer | How much |\n| `simname` | string | Where it is, as a link; without the grid when it is the grid that asks (`gk`) |\n| `globalposition` | string | Where on the map of the world |\n| `eventflags` | integer | The rating |\n\n### `classifieds_info_query`\n\nOne classified, with all it says.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `classifiedID` | string | The UUID of the classified |\n\n**Answer** (each row of `data`)\n\n| Field | Type | |\n| --- | --- | --- |\n| `classifieduuid` | string | Its UUID |\n| `creatoruuid` | string | Who made it |\n| `creationdate` | integer | Unix time |\n| `expirationdate` | integer | Unix time |\n| `category` | string | Its category |\n| `name` | string | Its title |\n| `description` | string | What it is |\n| `parceluuid` | string | The parcel it points to |\n| `parentestate` | integer | The estate |\n| `snapshotuuid` | string | Its picture |\n| `simname` | string | The region |\n| `posglobal` | string | Where |\n| `parcelname` | string | The parcel |\n| `classifiedflags` | integer | Its flags |\n| `priceforlisting` | integer | What the listing costs |\n\n### `avatar_publish_update`\n\nThe \"show in search\" box of a profile, which OpenSimulator ignores and the module tells here with the secure session of the avatar.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `avatar_id` | string | The UUID of the avatar |\n| `secure_session_id` | string | Its secure session, which only the simulator it is connected to holds |\n| `allow_publish` | string | `true` to show the profile in search |\n\n**Answer**: `success`, with the reason in `errorMessage` when it failed.\n",
                "parameters": [
                    {
                        "name": "grid",
                        "in": "path",
                        "required": true,
                        "description": "The nick of the grid",
                        "schema": {
                            "type": "string"
                        }
                    },
                    {
                        "name": "gk",
                        "in": "query",
                        "required": false,
                        "description": "The gatekeeper of the grid the search is made for (`grid.example.org:8002`), when the search is shared: only its places are answered",
                        "schema": {
                            "type": "string"
                        }
                    }
                ],
                "requestBody": {
                    "required": true,
                    "content": {
                        "text/xml": {
                            "schema": {

                                "description": "XML-RPC method call"
                            },
                            "examples": {
                                "dir_places_query": {
                                    "summary": "dir_places_query",
                                    "value": "<?xml version=\"1.0\"?>\n<methodCall>\n<methodName>dir_places_query<\/methodName>\n<params>\n<param>\n<value><struct>\n<member><name>text<\/name>\n<value><string>rose garden<\/string><\/value>\n<\/member>\n<member><name>flags<\/name>\n<value><int>33554432<\/int><\/value>\n<\/member>\n<member><name>category<\/name>\n<value><int>0<\/int><\/value>\n<\/member>\n<member><name>query_start<\/name>\n<value><int>0<\/int><\/value>\n<\/member>\n<\/struct><\/value>\n<\/param>\n<\/params>\n<\/methodCall>"
                                },

        "/grids/{grid}/currency.php": {
            "post": {
                "operationId": "currency",
                "tags": [
                    "Economy"
                ],
                "summary": "Currency",
                "description": "Quotes, purchases, balances and transfers. XML-RPC at `currency.php` of the economy address of the grid. The viewer asks the quote and buys; the simulators ask the balance of the avatars who are on them, move the money of a purchase, and claim the avatars that arrive. The answer is a struct with `success`, and the reason (`errorMessage`, `errorURI`) when it is false.\n\n### `getCurrencyQuote`\n\nThe viewer asks what an amount of currency costs.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `agentId` | string | The avatar |\n| `secureSessionId` | string | Its secure session |\n| `currencyBuy` | integer | The amount |\n\n**Answer**\n\n| Field | Type | |\n| --- | --- | --- |\n| `success` | boolean | Whether the avatar proved who they are |\n| `currency` | object | `estimatedCost` (in cents) and `currencyBuy` (the amount, rounded to the pack of the module when it has some) |\n| `confirm` | string | What ties this quote to the purchase: the key of the grid and the address of whoever asked |\n| `errorMessage` | string | Why not, when it failed |\n| `errorURI` | string | The page of the helpers the viewer opens |\n\n### `buyCurrency`\n\nThe viewer buys currency.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `agentId` | string | The avatar |\n| `secureSessionId` | string | Its secure session |\n| `currencyBuy` | integer | The amount |\n| `confirm` | string | The value the quote gave |\n\n**Answer**\n\n| Field | Type | |\n| --- | --- | --- |\n| `success` | boolean | Whether the currency was added; when it was not, the module of the currency of the grid says what to do (Gloebit: finish on its site, Podex: use its terminals) |\n| `errorMessage` | string | Why not |\n| `errorURI` | string | What the viewer opens |\n\n### `simulatorUserBalanceRequest`\n\nA simulator asks the balance of an avatar who is on it.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `agentId` | string | The avatar |\n| `secureSessionId` | string | Its secure session: the funds are for the one who holds it |\n\n**Answer**\n\n| Field | Type | |\n| --- | --- | --- |\n| `success` | boolean | Whether the avatar could be authenticated |\n| `agentId` | string | The avatar |\n| `funds` | integer | Its balance |\n\n### `regionMoveMoney`\n\nA region moves money from an avatar to another (a purchase, a gift, a fee).\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `agentId` | string | Who pays |\n| `destId` | string | Who is paid |\n| `secureSessionId` | string | The secure session of the payer |\n| `regionId` | string | The region that asks |\n| `secret` | string | The secret of the region, which the grid gave it |\n| `cash` | integer | The amount |\n| `transactionType` | integer | The kind of transaction (5001 gift, 5002 object sale...) |\n| `flags` | integer | Its flags |\n| `description` | string | What it is for |\n| `aggregatePermInventory` | integer | Permissions of what is sold |\n| `aggregatePermNextOwner` | integer | Permissions of what is sold |\n\n**Answer**\n\n| Field | Type | |\n| --- | --- | --- |\n| `success` | boolean | Whether the money moved |\n| `agentId` | string | The payer |\n| `funds` | integer | The balance of the payer before |\n| `funds2` | integer | The same |\n| `currencySecret` | string | A space: nothing |\n\n### `simulatorClaimUserRequest`\n\nA region claims an avatar: it is the one they are on now.\n\n**Request** (the struct)\n\n| Field | Type | |\n| --- | --- | --- |\n| `agentId` | string | The avatar |\n| `secureSessionId` | string | Its secure session |\n| `regionId` | string | The region |\n| `secret` | string | The secret of the region |\n\n**Answer**\n\n| Field | Type | |\n| --- | --- | --- |\n| `success` | boolean | Whether the region is now the one of the avatar |\n| `agentId` | string | The avatar |\n| `funds` | integer | Its balance |\n| `currencySecret` | string | A space: nothing |\n",

                "description": "What another install brings into this one. `kind` `simulator`: a simulator of an older install (its config, an OpenSim.ini or its file of opensim.d with its includes, and the regions it names) joins a grid of this machine: its database is kept as it is (the new config uses the same, nothing is copied), its regions are copied with their UUID and their place, its ports and the settings that differ from the defaults of the core are kept. `mode` `plan` (the default) writes nothing and says what would be written and where (`writes`), `apply` writes it, the simulator disabled: the old one is stopped by its operator (`reminders`), then the new one enabled and started. Refused (400) when the grid has the simulator, or a region of its name or UUID, already. `kind` `flux`: the posts of the stream of a site of w4os-wp (its `flux_post` posts, published, with their author `_avatar_uuid`) brought into the stream of the `grid`, each once; `file` the wp-config.php of the site, which says its database and the prefix of its tables. The plan says how many posts (`posts`), by avatar (`avatars`), the ones it skips and why (`skipped`), and how many were brought before (`imported`). `kind` `grid-settings`: the settings of a grid of another install (`file`, its OpenSim.ini, with the files it includes, as OpenSimulator reads them: its constants replaced, the last word of each key) brought into the OpenSim.ini of the `grid` of this machine, for the sections of its options (search and data services, economy and Gloebit, offline messages, profiles, groups): what the grid has already is never replaced, a folder of a simulator and the money of DTL/NSL are left out; the plan says the `settings` of its OpenSim.ini and the `files` laid (OpenSim.ini, and the Gloebit.ini of the grid, the one place of the settings of Gloebit, which the simulators include), a secret masked (a key, a secret, a password, a connection string), the constants kept as references (the ones this machine lacks, the site of the grid `WebURL`, defined in the `[Const]` of the grid), the `target` file and the `notes` (what is left out and why: the money of DTL/NSL is not handled; DATA_SRV_MISearch is DATA_SRV_<nick> now). One place for the settings of the simulators (`targets`): the OpenSim.ini of a grid that has a master (the master gives it to every simulator), else each simulator of the grid, whose config is whole (a grid that runs elsewhere, its simulators made without a master), the constants they lack defined in each; the repair of the options copies none of them again, and never changes a valid value.",

        "schemas": {
            "Problem": {
                "type": "object",

                "required": [

                    "status": {

                    "code": {
                        "type": "string",
                        "enum": [
                            "not-found",
                            "invalid-request",
                            "invalid-document",
                            "type-conflict",
                            "unauthorized",
                            "method-not-allowed",
                            "channel-unavailable",
                            "instance-failed",
                            "internal-error",
                            "sign-in-refused",
                            "account-disabled",
                            "post-invalid",
                            "account-banned",

                            "name-invalid",
                            "name-reserved",

                            "email-required",
                            "model-unknown",
                            "link-invalid",
                            "field-unknown",
                            "field-read-only",
                            "flag-unknown",
                            "owner-unknown",
                            "config-not-writable",
                            "instance-user-required",
                            "restore-conflict",
                            "source-not-readable",
                            "estate-shared",
                            "filter-unknown",
                            "filter-value-unknown",
                            "sort-unknown",
                            "role-unknown",
                            "role-level-conflict",
                            "token-refused",
                            "no-confirmation-pending",
                            "mail-failed"
                        ],
                        "description": "What went wrong, stable: what a site tells its people in its own language (the detail is the English one). `not-found`: What is asked is not there (a grid, a resource, an avatar): `resource` names its kind, a type of the API, when it is one; `invalid-request`: A value of the request is wrong, the detail says which; `invalid-document`: The body is not a JSON:API document; `type-conflict`: The type of the resource of the body is not the one of the address; `unauthorized`: The operation needs an API key; `method-not-allowed`: The address does not take this method; `channel-unavailable`: Nothing can do it now: a database, a simulator, a file cannot be reached; `instance-failed`: An instance (Robust, a simulator) failed; `internal-error`: The server failed, the log says why; `sign-in-refused`: The name (or the email) or the password is wrong; `account-disabled`: The password is right, but a manager disabled the account; `post-invalid`: The post is empty or too long (1 to 1000 characters); `account-banned`: The account is banned: only an unban (banned false) lets it in again; `email-unconfirmed`: The password is right, but the account waits for the confirmation of its email; `name-invalid`: The name is not a first and a last name of letters, digits and -; `name-reserved`: A part of the name is reserved: Default, Test, Admin, the name of the grid; `name-taken`: An avatar has this name already; `password-required`: A password is needed; `password-invalid`: The password is too short, too long, or has a double quote; `email-invalid`: The email is not an address; `email-required`: An email is needed to be confirmed; `model-unknown`: The model is not an avatar model of the grid; `link-invalid`: The link is not a web address; `field-unknown`: A value given cannot be changed; `field-read-only`: The value is the one of a file its operator changes (the name, the place, the size of a region); `flag-unknown`: The flag is not one of a region (DefaultRegion, FallbackRegion, Persistent...); `owner-unknown`: The grid has no avatar of this UUID; `config-not-writable`: A config file of the grid cannot be written by the process of the API (it belongs to the user of the grid): nothing was changed, the detail names the file; `instance-user-required`: The instances are started and stopped by the user that runs them: this process is another (the web server of a site); nothing was done; `restore-conflict`: The backup holds what this machine has already (a grid, a simulator, a database with tables): nothing was replaced; `source-not-readable`: The import cannot read files of the older install (its config, its regions, the state of its scripts): nothing was written, the detail names them; `estate-shared`: The owner of a region is the one of its estate, which has other regions: they would change owner too; `filter-unknown`: The list has no such filter (the detail names the ones it has); `filter-value-unknown`: The filter does not take this value (the detail names the ones it takes); `sort-unknown`: The list cannot be sorted so (the detail names the sorts it takes); `role-unknown`: The role is not one of resident, god-like, customer-service, liaison, god, maintenance; `role-level-conflict`: The level given with a role is not one of that role; `token-refused`: The token is not valid, was used, or has expired; `no-confirmation-pending`: The avatar does not wait for the confirmation of its email; `mail-failed`: The mail could not be sent"
                    },

                    }
