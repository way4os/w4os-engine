# The name of the engine before w4os: an empty package that brings w4os-engine on an upgrade, dropped after one release.
name: opensim-engine
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: oldlibs
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
  transitional package for w4os-engine
  The OpenSimulator engine for PHP is w4os-engine now. This empty package
  brings it on an upgrade; it can be removed.
homepage: https://github.com/way4os/w4os-engine
license: AGPL-3.0-or-later

depends:
  - w4os-engine (= ${DEB_VERSION})

contents:
  - src: packaging/w4os-engine.copyright
    dst: /usr/share/doc/opensim-engine/copyright
    file_info:
      mode: 0644
