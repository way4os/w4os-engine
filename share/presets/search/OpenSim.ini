;; The module of search of the simulators asks the helpers for the places, the land for sale...
[Search]
    Module = OpenSimSearch
    SearchURL = "{{url_query}}"

;; ... and the simulators tell their regions to the search: the helpers of the grid (DATA_SRV_<nick of the grid>) and the shared
;; public directory, 2do (DATA_SRV_2do, where the grids find each other's places), or one of them alone, as the setup chose
[DataSnapshot]
    index_sims = true
    gridname = "{{grid_name}}"
    DATA_SRV_{{grid_nick}} = "{{register_own}}"
    DATA_SRV_2do = "{{register_2do}}"
