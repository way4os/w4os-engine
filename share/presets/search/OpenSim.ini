;; The module of search of the simulators asks the helpers for the places, the land for sale...
[Search]
    Module = OpenSimSearch
    SearchURL = "{{url_query}}"

;; ... and the simulators tell their regions to the search: the helpers of the grid (DATA_SRV_<nick of the grid>) and the shared
;; public directory, 2do (DATA_SRV_2do, where the grids find each other's places; take the line out to keep the places of the grid
;; to its own search)
[DataSnapshot]
    index_sims = true
    gridname = "{{grid_name}}"
    DATA_SRV_{{grid_nick}} = "{{url_register}}"
    DATA_SRV_2do = "https://2do.directory/helpers/register.php"
