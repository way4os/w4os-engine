;; Gloebit.ini: the economy of the grid through Gloebit, every setting of the module in this one file (the simulators include it).
;; A pre-setting to adjust: the environment is sandbox until the grid has its keys of production.
[Economy]
    economymodule = Gloebit
    SellEnabled = true
    PriceUpload = 0
    PriceGroupCreate = 0

[Gloebit]
    Enabled = true
    GLBEnvironment = sandbox
