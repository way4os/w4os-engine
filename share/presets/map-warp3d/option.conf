[Option]
Label = "Map of the regions in 3D (Warp3D)"
Description = "The map tiles show the regions in 3D, their terrain textured, their prims and meshes with their textures, each tile kept in the cache of its simulator"
Offer = false
Default = true
Requires = warp3d
Needs = "the simulators of {nick} cannot write their map tiles where their core puts them: they keep the simple map (MapImageModule), until the package opensim-<release>-maptiles of their core is installed, or a newer OpenSimulator"
