;; Helpers.ini: what w4os-helpers need and OpenSim.ini and Robust.ini have no place for, in the format of
;; OpenSimulator. The settings that have an official place (the name of the grid, its addresses, the message of
;; the day, the databases, the economy module and Gloebit...) are read from OpenSim.ini and Robust.ini, do not copy them here. This file may hold
;; any of them, in the same sections, for a web host that has no OpenSimulator, but what the other files say wins.
;; Like every ini file of the grid, it may hold passwords: mode 640, group of the web server.

[Helpers]
;; Where the helpers are: the base of their pages and services. A page of the grid whose address is under it is served by
;; the helpers, any other by the site (opensim web <grid> set <page> <url>). "https://example.org/" serves every page with
;; the helpers; without it, the economy of the grid, else the web site and /helpers
;; HelpersURL = "https://example.org/helpers"
;; The directory of the grids registered in the search, when the site serves it (Robust has no setting for it)
;; DirectoryURL = "https://example.org/directory"
;; The destinations of the guide: a file (looked for in this folder) or a URL, "Name|Region URL" lines, a name
;; alone starts a category
;; GuideSource = "destinations.txt"
;; The registry of the search (parcels, hosts, events...): Robust's database unless it has its own
;; SearchConnectionString = "Data Source=localhost;Database=ossearch;User ID=opensim;Password=*****;"
;; false when another install keeps that registry: this one reads it, never writes (no search or events task)
;; MaintainSearch = false
;; The blocks of the home page of the helpers, in their order (by default search, popular_places, destination_guide)
;; HomeBlocks = "search, popular_places"
;; HYPEvents, the calendar the events are read from
HypEventsURL = "{{events_url}}"
;; Whether the helpers serve the economy of the grid, as the setup or Provide of its page says it
EconomyProvided = {{economy_provided}}
;; Whatever this folder holds (templates/, assets/) replaces the files of the helpers
;; ThemePath = "theme"
;; LogoURL = "https://example.org/logo.png"
;; MailSender = "no-reply@example.org"

[Models]
;; The avatar models a new avatar can look like (the keys of w4os): the active avatars whose first name (first),
;; last name (last) or either (any) is MatchPattern, or the avatars of List (uuid)
;; Match = any
;; MatchPattern = Default
;; List = "<uuid>, <uuid>"
