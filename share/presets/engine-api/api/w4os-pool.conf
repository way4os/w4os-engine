; {{pool_about}}
;
; Written by the suite in /etc/php/<version>/fpm/pool.d/{{pool_name}}.conf (opensim web GRID api caddy --install, the upgrade of
; w4os-engine), then: systemctl reload php<version>-fpm
[{{pool_name}}]
user = {{pool_user}}
group = {{pool_group}}
listen = {{php_socket}}
listen.owner = {{pool_user}}
listen.group = {{web_group}}
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s
; The layout of the install, as the command line has it
clear_env = no
