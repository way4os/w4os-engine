# The engine API of the grid {{grid_nick}}, for the sites of this machine only (127.0.0.1:{{api_port}}), run as the user of the
# instances through the pool opensim-api ({{php_socket}}). A server block of its own, in the http block of Nginx; the site sets
# api_url http://127.0.0.1:{{api_port}}/api and its key.
server {
	listen 127.0.0.1:{{api_port}};
	location ~ ^/api(/|$) {
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME {{docroot}}/index.php;
		fastcgi_param OPENSIM_GRID {{grid_nick}};
		fastcgi_param HTTP_AUTHORIZATION $http_authorization;
		fastcgi_pass unix:{{php_socket}};
	}
	location / {
		return 404;
	}
}
