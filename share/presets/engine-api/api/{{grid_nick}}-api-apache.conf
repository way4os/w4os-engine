# The engine API of the grid {{grid_nick}}, for the sites of this machine only (127.0.0.1:{{api_port}}), run as the user of the
# instances through the pool opensim-api ({{php_socket}}): PHP-FPM with proxy_fcgi (a2enmod proxy_fcgi), never mod_php, which runs
# as the web server. In the config of Apache (/etc/apache2/conf-available, a2enconf); the site sets
# api_url http://127.0.0.1:{{api_port}}/api and its key.
Listen 127.0.0.1:{{api_port}}
<VirtualHost 127.0.0.1:{{api_port}}>
	DocumentRoot {{docroot}}
	AliasMatch "^/api(?:/.*)?$" "{{docroot}}/index.php"
	<Directory {{docroot}}>
		Require local
		SetEnv OPENSIM_GRID {{grid_nick}}
		CGIPassAuth On
	</Directory>
	<FilesMatch "\.php$">
		SetHandler "proxy:unix:{{php_socket}}|fcgi://localhost"
	</FilesMatch>
</VirtualHost>
