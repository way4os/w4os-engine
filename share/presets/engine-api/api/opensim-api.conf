; The engine API of the grids of this machine, run as the user of their instances ({{system_user}}), whose files they are: what a
; site changes (a region enabled, a backup, a restore, an instance started) is done by that user, never by the web server, which
; only reaches this socket. The site calls it with a key (opensim api-key create), as `engine: remote`.
;
; Put it in /etc/php/<version>/fpm/pool.d/opensim-api.conf, then: systemctl reload php<version>-fpm
[opensim-api]
user = {{system_user}}
group = {{system_user}}
listen = {{php_socket}}
listen.owner = {{system_user}}
listen.group = {{web_group}}
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s
; The layout of the install, as the command line has it
clear_env = no
