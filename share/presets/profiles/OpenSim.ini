;; The profiles (and their classifieds) are kept by Robust, which the simulator asks
[UserProfiles]
    ProfileServiceURL = "${Const|BaseURL}:${Const|PublicPort}"
;; The web address of a profile (true, the default of OpenSimulator): the viewers show the page of the profile the helpers give
;; (its profileURL), and the links the users set to other sites; false hides both
    AllowUserProfileWebURLs = true
